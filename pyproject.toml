[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "profit-rate"
version = "0.0.1"
description = "The aim is to calculate profit rates based on anwar shaik's capitalism, conflict and crises."
authors = [
  { name = "georghoeller" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["profit-rate"]
include = ["pyproject.toml", "profit-rate/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["profit-rate"]
force-sort-within-sections = true

